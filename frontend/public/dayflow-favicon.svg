<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="DayFlow favicon">
  <defs>
    <linearGradient id="taupe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7B49A"/>
      <stop offset="1" stop-color="#A99276"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A927D"/>
      <stop offset="1" stop-color="#2F6F5D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263653"/>
      <stop offset="1" stop-color="#18243A"/>
    </linearGradient>
  </defs>

  <!-- Three warm-taupe dashboard bars -->
  <g fill="url(#taupe)">
    <rect x="28" y="62" width="60" height="16" rx="8"/>
    <rect x="18" y="120" width="58" height="16" rx="8"/>
    <rect x="28" y="178" width="60" height="16" rx="8"/>
  </g>

  <!-- Emerald completion check -->
  <path d="M99 128 L119 148 L166 101"
        fill="none"
        stroke="url(#green)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Midnight-blue progress arc -->
  <path d="M145 58
           A76 76 0 1 1 145 198"
        fill="none"
        stroke="url(#blue)"
        stroke-width="20"
        stroke-linecap="round"/>
</svg>